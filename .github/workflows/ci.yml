name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck
        env:
          # Satisfy modules that read env at import in typecheck-only paths
          DATABASE_URL: postgresql://stancehub:stancehub@localhost:5433/stancehub
          REDIS_URL: redis://localhost:6379
          BETTER_AUTH_SECRET: ci-secret-at-least-16-chars
          BETTER_AUTH_URL: http://localhost:3000

      - name: Test
        run: pnpm test
