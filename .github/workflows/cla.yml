name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/StanceHub/stancehub/blob/main/docs/CLA.md
          branch: main
          allowlist: dependabot[bot],github-actions[bot],bot*
          lock-pullrequest-aftermerge: false
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-notsigned-prcomment: |
            Thank you for your contribution to StanceHub.

            Please read the [Contributor License Agreement](https://github.com/StanceHub/stancehub/blob/main/docs/CLA.md), then reply to this pull request with exactly:

            `I have read the CLA Document and I hereby sign the CLA`

            You only need to sign once. After signing, the CLA check will pass on future PRs.
            Comment `recheck` if the check needs to be re-run.
          custom-allsigned-prcomment: All contributors to this pull request have signed the CLA.
          create-file-commit-message: Create CLA signature store
          signed-commit-message: $contributorName has signed the CLA in $owner/$repo#$pullRequestNo
