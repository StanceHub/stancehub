# Project name controls container prefixes (avoids "deploy-*" from this folder name).
name: stancehub

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: stancehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stancehub
      POSTGRES_PASSWORD: stancehub
      POSTGRES_DB: stancehub
    ports:
      - "5433:5432"
    volumes:
      - stancehub_postgres_data:/var/lib/postgresql/data
      - ./postgres/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stancehub -d stancehub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: stancehub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - stancehub_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stancehub_postgres_data:
  stancehub_redis_data:
